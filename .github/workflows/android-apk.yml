
name: Build Tahir Hisab APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            find . -maxdepth 4 -type f
            exit 1
          fi
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted
          cp -a extracted/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahir-Hisab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
